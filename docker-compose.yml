name: ortotraceability

services:
    mysql:
        image: 'mysql:8.0'
        container_name: ortotraceability-mysql
        ports:
            - '${DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql_data:/var/lib/mysql'
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 10
            timeout: 5s
            interval: 5s

    redis:
        image: redis:7-alpine
        container_name: ortotraceability-redis
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
    redis-data:
        driver: local
